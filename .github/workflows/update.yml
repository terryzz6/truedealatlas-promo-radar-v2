name: Update official offers
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Scrape public official sources
        run: python scraper.py
      - name: Build static site
        run: python build.py
      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "true-deal-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers.json site
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "chore: refresh official offers"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy updated site to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
